name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p stats

      - name: Generate Tech Stats
        uses: lowlighter/metrics@latest
        with:
          filename: stats/tech-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_categories: programming
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

      - name: Generate Activity (Last 6 Months)
        uses: lowlighter/metrics@latest
        with:
          filename: stats/activity-6-months.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: activity
          config_time_range: 6months

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -d "stats" ] && [ -n "$(ls -A stats 2>/dev/null)" ]; then
            git add stats/
            git commit -m "chore: update github stats" || exit 0
            git push
          else
            echo "No stats files generated to commit"
          fi
